services:
  nginx:
    image: nginx:latest
    container_name: nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    environment:
      - DESTINATION_IP=${DESTINATION_IP}
      - GATEWAY_HOST=${GATEWAY_HOST}
    command: tail -f /dev/null
