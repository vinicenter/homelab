services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:latest
    volumes:
      - $VOLUME_BASE_PATH/adguardhome_work:/opt/adguardhome/work
      - $VOLUME_BASE_PATH/adguardhome_config:/opt/adguardhome/conf
    restart: unless-stopped
    ports:
      # Web UI: localhost only, reached by the Pangolin agent (newt)
      - 127.0.0.1:3000:3000
      # DNS: must stay reachable from the LAN
      - 53:53/tcp
      - 53:53/udp
      - 853:853/tcp
      - 784:784/udp
      - 853:853/udp
      - 8853:8853/udp
      - 5443:5443/tcp
      - 5443:5443/udp
    networks:
      - home-lab
networks:
  home-lab:
