services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:latest
    expose:
      - 3000
    volumes:
      - $VOLUME_BASE_PATH/adguardhome_work:/opt/adguardhome/work\
      - $VOLUME_BASE_PATH/adguardhome_config:/opt/adguardhome/conf\
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 853:853/tcp
      - 784:784/udp
      - 853:853/udp
      - 8853:8853/udp
      - 5443:5443/tcp
      - 5443:5443/udp
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguardhome.rule=Host(`adguardhome.$GATEWAY_HOST`)
      - traefik.http.routers.adguardhome.entrypoints=web,websecure
      - traefik.http.routers.adguardhome.tls.certresolver=letsencrypt
      - traefik.http.services.adguardhome.loadbalancer.server.port=3000
    networks:
      - home-lab
networks:
  home-lab:
    driver: bridge
