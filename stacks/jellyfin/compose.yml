services:
  jellyfin:
    container_name: jellyfin
    entrypoint:
      - /init
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PATH=/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HOME=/root
      - LANGUAGE=en_US.UTF-8
      - LANG=en_US.UTF-8
      - TERM=xterm
      - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
      - S6_VERBOSITY=1
      - S6_STAGE2_HOOK=/docker-mods
      - VIRTUAL_ENV=/lsiopy
      - LSIO_FIRST_PARTY=true
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.$GATEWAY_HOST`)
      - traefik.http.routers.jellyfin.entrypoints=web,websecure
      - traefik.http.routers.jellyfin.tls.certresolver=letsencrypt
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    image: lscr.io/linuxserver/jellyfin:latest
    expose:
      - 8096
    volumes:
      - $VOLUME_BASE_PATH/jellyfin_config:/config
      - $VOLUME_BASE_PATH/jellyfin_data:/data
    restart: unless-stopped
    networks:
      - home-lab
  sonarr:
    container_name: sonarr
    restart: unless-stopped
    image: linuxserver/sonarr
    expose:
      - 8989
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.$GATEWAY_HOST`)
      - traefik.http.routers.sonarr.entrypoints=web,websecure
      - traefik.http.routers.sonarr.tls.certresolver=letsencrypt
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    volumes:
      - $VOLUME_BASE_PATH/sonarr_config:/config
      - $VOLUME_BASE_PATH/jellyfin_data/tv:/tv
      - $VOLUME_BASE_PATH/jellyfin_data/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - home-lab
  radarr:
    container_name: radarr
    restart: unless-stopped
    image: linuxserver/radarr
    expose:
      - 7878
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.$GATEWAY_HOST`)
      - traefik.http.routers.radarr.entrypoints=web,websecure
      - traefik.http.routers.radarr.tls.certresolver=letsencrypt
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    volumes:
      - $VOLUME_BASE_PATH/radarr_config:/config
      - $VOLUME_BASE_PATH/jellyfin_data/movies:/movies
      - $VOLUME_BASE_PATH/jellyfin_data/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - home-lab
  prowlarr:
    container_name: prowlarr
    restart: unless-stopped
    image: linuxserver/prowlarr
    expose:
      - 9696
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.$GATEWAY_HOST`)
      - traefik.http.routers.prowlarr.entrypoints=web,websecure
      - traefik.http.routers.prowlarr.tls.certresolver=letsencrypt
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    volumes:
      - $VOLUME_BASE_PATH/prowlarr_config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - home-lab
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    expose:
      - 8080
    ports:
      - 6881:6881
      - 6881:6881/udp
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.$GATEWAY_HOST`)
      - traefik.http.routers.qbittorrent.entrypoints=web,websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
    volumes:
      - $VOLUME_BASE_PATH/qbittorrent_config:/config
      - $VOLUME_BASE_PATH/jellyfin_data/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
      - WEBUI_USERNAME=vinicenter
      - WEBUI_PASSWORD=$QBITTORRENT_PASSWORD
    networks:
      - home-lab
    restart: unless-stopped
  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr
    restart: unless-stopped
    expose:
      - 6767
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.$GATEWAY_HOST`)
      - traefik.http.routers.bazarr.entrypoints=web,websecure
      - traefik.http.routers.bazarr.tls.certresolver=letsencrypt
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    volumes:
      - $VOLUME_BASE_PATH/bazarr_config:/config
      - $VOLUME_BASE_PATH/jellyfin_data/tv:/tv
      - $VOLUME_BASE_PATH/jellyfin_data/movies:/movies
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - home-lab
networks:
  home-lab:
