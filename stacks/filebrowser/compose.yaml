services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    expose:
      - 80
    volumes:
      - /:/srv
      - $VOLUME_BASE_PATH/filebrowser_db/filebrowser.db:/database.db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`filebrowser.$GATEWAY_HOST`)
      - traefik.http.routers.filebrowser.entrypoints=web,websecure
      - traefik.http.routers.filebrowser.tls.certresolver=letsencrypt
      - traefik.http.routers.filebrowser.middlewares=authelia@docker
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
    networks:
      - home-lab
networks:
  home-lab:
