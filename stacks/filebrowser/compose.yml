services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    ports:
      - 127.0.0.1:8081:80
    volumes:
      - /:/srv
      - ./config/:/config
      - $VOLUME_BASE_PATH/filebrowser_db:/database
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - home-lab
networks:
  home-lab:
