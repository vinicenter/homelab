services:
  firetv-remote-bridge:
    image: vinicenter/firetv-remote-bridge:latest
    container_name: firetv-remote-bridge
    restart: unless-stopped
    devices:
      - /dev/input/event1:/dev/input/event1
    environment:
      - INPUT_DEVICE=/dev/input/event1
      - HOME_ASSISTANT_URL=$HOME_ASSISTANT_FIRETV_EVENT_URL
      - HOME_ASSISTANT_TOKEN=$HOME_ASSISTANT_TOKEN
      - LONG_PRESS_THRESHOLD=0.8
      - RECONNECT_DELAY=2.0
      - REQUEST_TIMEOUT=5.0
      - POLL_INTERVAL=0.1
      - LOG_LEVEL=INFO
    privileged: true
    networks:
      - home-lab
networks:
  home-lab:
